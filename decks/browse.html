<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Deck Directory — Once Upon a Galaxy</title>
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --rarity-common: #8e9aaf;
            --rarity-uncommon: #2ec4b6;
            --rarity-rare: #3a86ff;
            --rarity-epic: #9d4edd;
            --rarity-legendary: #ffb703;
        }

        .browse-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px 80px;
            width: 100%;
        }

        /* Hub Header */
        .browse-hero {
            text-align: center;
            margin-bottom: 32px;
        }

        .browse-hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }

        .browse-hero h1 span {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .browse-hero p {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 680px;
            margin: 0 auto;
        }

        /* Captain Filter Carousel / Strip */
        .captain-strip-container {
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .captain-strip {
            display: flex;
            align-items: center;
            gap: 12px;
            width: max-content;
        }

        .captain-strip-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .captain-strip-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .captain-strip-item.active {
            background: rgba(99, 102, 241, 0.25);
            border-color: var(--accent-primary);
            color: #fff;
        }

        .captain-strip-thumb {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            background: #111;
        }

        /* Controls Filter Bar */
        .filter-controls-card {
            background: rgba(18, 22, 34, 0.85);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 18px 24px;
            backdrop-filter: blur(16px);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .search-field-wrap {
            position: relative;
            flex: 1;
            min-width: 260px;
        }

        .filter-toggles-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .toggle-check-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            color: #fff;
            cursor: pointer;
            user-select: none;
        }

        .toggle-check-label input {
            cursor: pointer;
            accent-color: var(--accent-primary);
        }

        .sort-select {
            background: rgba(12, 15, 24, 0.9);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: #fff;
            padding: 8px 14px;
            font-size: 0.88rem;
            outline: none;
        }

        /* Tabs (Community / My Decks / In-Game Decks) */
        .directory-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
        }

        .dir-tab-btn {
            padding: 10px 18px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dir-tab-btn.active {
            color: #fff;
            border-bottom-color: var(--accent-primary);
        }

        /* Deck Cards Grid */
        .deck-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }

        .deck-summary-card {
            background: rgba(22, 27, 42, 0.9);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .deck-summary-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            border-color: var(--accent-primary);
        }

        .card-top-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-cap-art {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            border: 2px solid var(--rarity-legendary);
            object-fit: cover;
            background: #111;
        }

        .card-heading {
            flex: 1;
            min-width: 0;
        }

        .card-deck-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .card-deck-summary {
            font-size: 0.84rem;
            color: #cbd5e1;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 12-Card Preview Strip */
        .card-thumb-strip {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
            height: 38px;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 3px;
            overflow: hidden;
        }

        .strip-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 3px;
            background: #1e293b;
        }

        .card-bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .upvote-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ffd166;
            font-weight: 600;
        }

        .primer-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .badge-ready { background: rgba(46, 196, 182, 0.2); color: #2ec4b6; border: 1px solid #2ec4b6; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge-substitutable { background: rgba(255, 209, 102, 0.2); color: #ffd166; border: 1px solid #ffd166; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge-warning { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb primary"></div>
        <div class="glow-orb secondary"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="/index.html" class="logo">Galaxy<span>Tracker</span></a>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a href="/meta.html">Meta Insights</a>
            <a href="/tierlist.html">Auto Tier List</a>
            <a href="/decks.html">Meta Deck Analysis</a>
            <a href="/turns.html">Turn Breakdowns</a>
            <a href="/decks/browse.html" class="active">Community Decks</a>
            <a href="/decks/builder.html">Deck Builder</a>
        </div>
    </nav>

    <div class="browse-container">
        <!-- Hero Header -->
        <header class="browse-hero">
            <h1>Community <span>Decks & Primers</span></h1>
            <p>Explore competitive captain guides, user-created primer articles, and custom decks with collection matching & budget replacements.</p>
        </header>

        <!-- Captain Strip -->
        <div class="captain-strip-container">
            <div class="captain-strip" id="captainStrip">
                <div class="captain-strip-item active" data-cid="0">All Captains</div>
            </div>
        </div>

        <!-- Directory Tabs -->
        <div class="directory-tabs">
            <button class="dir-tab-btn active" data-tab="community">Public Community Decks</button>
            <button class="dir-tab-btn" data-tab="my_decks">My Saved Decks</button>
            <button class="dir-tab-btn" data-tab="ingame">Imported In-Game Decks</button>
        </div>

        <!-- Controls Card -->
        <div class="filter-controls-card">
            <div class="search-field-wrap">
                <input type="text" id="browseSearchInput" class="search-bar-input" style="padding-left: 14px;" placeholder="Search deck title, author, or archetype...">
            </div>
            <div class="filter-toggles-group">
                <label class="toggle-check-label">
                    <input type="checkbox" id="checkPrimersOnly">
                    <span>Primers Only</span>
                </label>
                <label class="toggle-check-label">
                    <input type="checkbox" id="checkCollectionOnly">
                    <span>Buildable by My Collection</span>
                </label>
                <select id="selectSort" class="sort-select">
                    <option value="trending">Sort: Trending (Upvotes)</option>
                    <option value="newest">Sort: Newest First</option>
                    <option value="winrate">Sort: Highest Win Rate</option>
                </select>
                <a href="/decks/builder.html" class="btn-action btn-primary-action">+ Build a Deck</a>
            </div>
        </div>

        <!-- Deck Cards Grid -->
        <div class="deck-cards-grid" id="deckGrid">
            <!-- Rendered via JS -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="/decks/js/deckStorage.js?v=2"></script>
    <script src="/decks/js/collectionMatcher.js?v=2"></script>
    <script>
        let allCardsMap = {};
        let activeCaptainCid = 0;
        let currentTab = 'community';
        let userCollectionMap = {};

        document.addEventListener('DOMContentLoaded', async () => {
            // Load Collection
            userCollectionMap = await DeckStorage.getUserCollection();

            // Load Cards Catalog
            try {
                const res = await fetch('/api/cards.json');
                allCardsMap = await res.json();
                renderCaptainStrip();
            } catch(e) {
                console.warn(e);
            }

            // Load Initial Decks
            fetchAndRenderDecks();

            setupControls();
        });

        function renderCaptainStrip() {
            const strip = document.getElementById('captainStrip');
            const captains = Object.values(allCardsMap).filter(c => c && c.card_type === 'captain');

            captains.forEach(cap => {
                const item = document.createElement('div');
                item.className = 'captain-strip-item';
                item.dataset.cid = cap.cid;
                item.innerHTML = `
                    <img class="captain-strip-thumb" src="https://static.galaxy.fun/cards/${cap.card_key || ''}__default__240.webp" onerror="this.src='/icon.png'">
                    <span>${cap.name}</span>
                `;
                item.addEventListener('click', () => {
                    document.querySelectorAll('.captain-strip-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    activeCaptainCid = cap.cid;
                    fetchAndRenderDecks();
                });
                strip.appendChild(item);
            });

            strip.querySelector('[data-cid="0"]').addEventListener('click', (e) => {
                document.querySelectorAll('.captain-strip-item').forEach(i => i.classList.remove('active'));
                e.currentTarget.classList.add('active');
                activeCaptainCid = 0;
                fetchAndRenderDecks();
            });
        }

        async function fetchAndRenderDecks() {
            const grid = document.getElementById('deckGrid');
            grid.innerHTML = '<div style="color: var(--text-muted); font-size: 0.95rem; grid-column: 1 / -1; padding: 20px 0;">Loading decks...</div>';

            if (currentTab === 'ingame') {
                renderInGameDecks();
                return;
            }

            const search = document.getElementById('browseSearchInput').value.trim();
            const primersOnly = document.getElementById('checkPrimersOnly').checked ? '1' : '';
            const sort = document.getElementById('selectSort').value;

            let url = `/api/browse-decks.php?sort=${sort}&view=${currentTab}`;
            if (activeCaptainCid > 0) url += `&captain=${activeCaptainCid}`;
            if (primersOnly) url += '&has_primer=1';
            if (search) url += `&q=${encodeURIComponent(search)}`;
            if (currentTab === 'my_decks') {
                url += `&author_id=${encodeURIComponent(DeckStorage.getAuthorToken())}`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                let decks = data.decks || [];

                // Filter by Collection if checked
                const filterCollection = document.getElementById('checkCollectionOnly').checked;
                if (filterCollection && Object.keys(userCollectionMap).length > 0) {
                    decks = decks.filter(dk => {
                        const evalRes = CollectionMatcher.evaluateDeck(dk, userCollectionMap);
                        return evalRes.status === 'ready' || evalRes.status === 'substitutable';
                    });
                }

                if (decks.length === 0) {
                    grid.innerHTML = '<div style="color: var(--text-muted); font-size: 0.95rem; grid-column: 1 / -1; padding: 40px 0; text-align: center;">No decks found matching your criteria. Try adjusting your filters or build the first one!</div>';
                    return;
                }

                grid.innerHTML = '';
                decks.forEach(dk => {
                    const card = createDeckCardElement(dk);
                    grid.appendChild(card);
                });
            } catch (err) {
                grid.innerHTML = '<div style="color: #ef4444; grid-column: 1 / -1;">Error loading decks: ' + err.message + '</div>';
            }
        }

        async function renderInGameDecks() {
            const grid = document.getElementById('deckGrid');
            const inGame = await DeckStorage.getImportedDecks();

            if (inGame.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px 0; color: var(--text-muted);">
                        <h3>No in-game decks found</h3>
                        <p style="margin-top: 6px;">Go to the <a href="/decks/builder.html" style="color: var(--accent-primary);">Deck Builder</a> and click "Upload In-Game Decks" to drop your <code>_deck_library</code> file!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = '';
            inGame.forEach(dk => {
                const el = document.createElement('div');
                el.className = 'deck-summary-card';

                const capCard = allCardsMap[String(dk.captain_cid)];
                const capArt = capCard ? `https://static.galaxy.fun/cards/${capCard.card_key || ''}__default__240.webp` : '/icon.png';

                // Strip
                const stripThumbs = (dk.card_cids || []).map(cid => {
                    const c = allCardsMap[String(cid)];
                    return `<img class="strip-thumb" src="https://static.galaxy.fun/cards/${c ? c.card_key : ''}__bronze__240.webp" onerror="this.src='/icon.png'">`;
                }).join('');

                el.innerHTML = `
                    <div class="card-top-row">
                        <img class="card-cap-art" src="${capArt}">
                        <div class="card-heading">
                            <div class="card-deck-name">${dk.name}</div>
                            <div class="card-sub">In-Game Slot ${dk.slot_id} • ${capCard ? capCard.name : 'Captain #' + dk.captain_cid}</div>
                        </div>
                    </div>
                    <div class="card-thumb-strip">${stripThumbs}</div>
                    <div class="card-bottom-row">
                        <span style="font-size: 0.78rem; color: #4ecdc4; font-weight: 600;">Imported HDTB</span>
                        <button class="btn-action btn-primary-action" style="padding: 4px 10px; font-size: 0.78rem;">Promote to Primer</button>
                    </div>
                `;

                el.querySelector('button').addEventListener('click', (e) => {
                    e.stopPropagation();
                    DeckStorage.saveActiveDraft(dk);
                    window.location.href = '/decks/builder.html';
                });

                grid.appendChild(el);
            });
        }

        function createDeckCardElement(dk) {
            const el = document.createElement('div');
            el.className = 'deck-summary-card';

            const capCard = allCardsMap[String(dk.captain_cid)];
            const capArt = capCard ? `https://static.galaxy.fun/cards/${capCard.card_key || ''}__default__240.webp` : '/icon.png';

            // Collection badge
            let collBadgeHtml = '';
            if (Object.keys(userCollectionMap).length > 0) {
                const evalRes = CollectionMatcher.evaluateDeck(dk, userCollectionMap);
                collBadgeHtml = CollectionMatcher.renderBadgeHtml(evalRes);
            }

            // 12-Card Strip
            const stripThumbs = (dk.card_cids || []).map(cid => {
                const c = allCardsMap[String(cid)];
                return `<img class="strip-thumb" src="https://static.galaxy.fun/cards/${c ? c.card_key : ''}__bronze__240.webp" onerror="this.src='/icon.png'">`;
            }).join('');

            const primerBadge = dk.has_primer ? '<span class="primer-pill">📖 Primer</span>' : '';

            el.innerHTML = `
                <div class="card-top-row">
                    <img class="card-cap-art" src="${capArt}">
                    <div class="card-heading">
                        <div class="card-deck-name">${dk.name}</div>
                        <div class="card-sub">By ${dk.author_name || 'Anonymous'} • ${capCard ? capCard.name : 'Captain'}</div>
                    </div>
                </div>
                <div class="card-deck-summary">${dk.summary || '12-card custom deck. Click to view composition and strategy.'}</div>
                <div class="card-thumb-strip">${stripThumbs}</div>
                <div class="card-bottom-row">
                    <div class="upvote-badge">★ ${dk.upvote_count || 0}</div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        ${collBadgeHtml}
                        ${primerBadge}
                    </div>
                </div>
            `;

            el.addEventListener('click', () => {
                window.location.href = '/decks/view.html?id=' + encodeURIComponent(dk.id);
            });

            return el;
        }

        function setupControls() {
            let debounceTimer;
            document.getElementById('browseSearchInput').addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(fetchAndRenderDecks, 150);
            });

            document.getElementById('checkPrimersOnly').addEventListener('change', fetchAndRenderDecks);
            document.getElementById('checkCollectionOnly').addEventListener('change', fetchAndRenderDecks);
            document.getElementById('selectSort').addEventListener('change', fetchAndRenderDecks);

            document.querySelectorAll('.dir-tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.dir-tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTab = btn.dataset.tab;
                    fetchAndRenderDecks();
                });
            });
        }
    </script>
</body>
</html>
