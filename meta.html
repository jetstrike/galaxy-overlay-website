<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Tracker - Meta Insights</title>
    <style>
        :root {
            --bg-main: #0a0a0c;
            --bg-secondary: #121216;
            --accent-primary: #8a2be2;
            --accent-secondary: #ff007f;
            --text-main: #f0f0f5;
            --text-muted: #a0a0b0;
            --glass-bg: rgba(20, 20, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(138, 43, 226, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 127, 0.05) 0%, transparent 50%);
        }

        .navbar {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo span {
            color: var(--text-main);
            -webkit-text-fill-color: var(--text-main);
        }

        .meta-dashboard {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .stats-header h1 {
            font-size: 2.5rem;
            margin: 0;
        }
        
        .stats-header h1 span {
            color: var(--accent-primary);
        }

        .controls-group {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .filter-select {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: border-color 0.3s;
        }
        .filter-select:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }
        .filter-select:focus {
            border-color: var(--accent-primary);
            outline: none;
        }
        .filter-select option {
            background: #111;
            color: #fff;
        }

        .total-matches {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        .total-matches h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }
        .total-matches p {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin: 0;
        }

        .table-section {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .table-section h2 {
            padding: 1.5rem;
            margin: 0;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid var(--glass-border);
            font-size: 1.5rem;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1.2rem;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
        }

        th {
            background: rgba(0,0,0,0.2);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
            white-space: nowrap;
        }

        th:hover {
            color: #fff;
        }
        th.sort-desc::after { content: " ▼"; }
        th.sort-asc::after { content: " ▲"; }
        
        td {
            font-size: 1rem;
            font-weight: 600;
        }
        td.item-name {
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rank-number {
            color: var(--text-muted);
            font-size: 0.9rem;
            width: 24px;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--accent-primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Galaxy<span>Tracker</span></div>
        <div class="nav-links" style="display: flex; gap: 2rem;">
            <a href="index.html" style="color: var(--text-main); text-decoration: none; font-weight: 600;">Home</a>
            <a href="meta.html" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Meta Insights</a>
        </div>
    </nav>

    <main class="meta-dashboard">
        <div class="stats-header">
            <h1>Live <span>Analytics</span></h1>
            <div class="controls-group">
                <select id="query-filter" class="filter-select">
                    <option value="captains">Captain Performance</option>
                </select>
                <select id="mmr-filter" class="filter-select">
                    <option value="0-99999">All MMR</option>
                    <option value="0-2500">&lt; 2500 MMR</option>
                    <option value="2500-3000">2500 - 3000 MMR</option>
                    <option value="3000-3500">3000 - 3500 MMR</option>
                    <option value="3500-4000">3500 - 4000 MMR</option>
                    <option value="4000-99999">&gt; 4000 MMR</option>
                </select>
                <div class="total-matches">
                    <h3>Matches Analyzed</h3>
                    <p id="total-matches-val">...</p>
                </div>
            </div>
        </div>

        <div class="table-section">
            <h2 id="dynamic-table-title">Captain Performance</h2>
            <div class="table-wrapper">
                <table>
                    <thead id="dynamic-thead">
                        <!-- Headers generated dynamically -->
                    </thead>
                    <tbody id="dynamic-tbody">
                        <tr><td colspan="10"><div class="loading"><div class="spinner"></div><div>Crunching numbers from the database...</div></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="meta.js"></script>
</body>
</html>
