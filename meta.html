<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Insights | Once Upon a Galaxy</title>
    <meta name="description" content="Live meta insights and statistics for Once Upon a Galaxy. View captain win rates, average placements, and pick rates.">
    <link rel="stylesheet" href="styles.css?v=1.0.15">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        .meta-dashboard {
            padding: 2rem 10%;
            max-width: 1200px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            position: relative;
            z-index: 10;
        }
        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
        }
        .stats-header h1 span {
            color: var(--accent-primary);
        }
        .total-matches {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        .total-matches h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }
        .total-matches p {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
        }
        .table-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 1.2rem;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
        }
        th {
            background: rgba(0,0,0,0.2);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }
        th:hover {
            color: #fff;
        }
        th.sort-desc::after { content: " ▼"; }
        th.sort-asc::after { content: " ▲"; }
        
        td {
            font-size: 1rem;
            font-weight: 600;
        }
        td.captain-name {
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .rank-number {
            color: var(--text-muted);
            font-size: 0.9rem;
            width: 24px;
        }
        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--accent-primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb primary"></div>
        <div class="glow-orb secondary"></div>
    </div>
    
    <nav class="navbar">
        <div class="logo">Galaxy<span>Tracker</span></div>
        <div class="nav-links" style="display: flex; gap: 2rem;">
            <a href="index.html" style="color: var(--text-main); text-decoration: none; font-weight: 600;">Home</a>
            <a href="meta.html" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Meta Insights</a>
        </div>
    </nav>

    <main class="meta-dashboard">
        <div class="stats-header">
            <h1>Live <span>Meta</span></h1>
            <div class="total-matches">
                <h3>Matches Analyzed</h3>
                <p id="total-matches-val">...</p>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th data-sort="name" style="text-align: left;">Captain</th>
                        <th data-sort="games">Games Played</th>
                        <th data-sort="pick_rate">Pick Rate</th>
                        <th data-sort="win_rate">Win Rate</th>
                        <th data-sort="top_3_rate">Top 3 Rate</th>
                        <th data-sort="avg_placement" class="sort-asc">Avg Placement</th>
                    </tr>
                </thead>
                <tbody id="captains-tbody">
                    <tr>
                        <td colspan="6">
                            <div class="loading">
                                <div class="spinner"></div>
                                <div>Crunching numbers from the database...</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="meta.js"></script>
</body>
</html>
