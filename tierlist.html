<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Tracker - Automated Tier List</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
    <!-- html2canvas for exporting the tier list -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .tierlist-dashboard {
            padding: 2rem 5%;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .stats-header h1 {
            font-size: 2.5rem;
            margin: 0;
        }
        
        .stats-header h1 span {
            color: var(--accent-secondary);
        }

        .controls-group {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .filter-select, .export-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: border-color 0.3s, background 0.3s, transform 0.2s;
        }
        .filter-select:hover, .export-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }
        .export-btn:active {
            transform: scale(0.95);
        }
        .export-btn {
            background: var(--accent-primary);
            color: white;
            border: none;
        }
        .export-btn:hover {
            background: var(--accent-primary-hover);
        }

        .filter-select option {
            background: #111;
            color: #fff;
        }

        /* Tier List Container */
        .tierlist-container {
            background: var(--bg-color); /* solid background for html2canvas */
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 0; /* no gaps between rows to look like traditional tier list */
        }

        .tier-row {
            display: flex;
            border-bottom: 1px solid rgba(0,0,0,0.4);
            min-height: 100px;
            background: rgba(20, 25, 35, 0.95);
        }
        
        .tier-row:last-child {
            border-bottom: none;
        }

        .tier-label {
            width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: #111;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.3);
            border-right: 1px solid rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        /* Traditional Tier Colors */
        .tier-S { background-color: #ff7f7f; }
        .tier-A { background-color: #ffbf7f; }
        .tier-B { background-color: #ffff7f; }
        .tier-C { background-color: #7fff7f; }
        .tier-D { background-color: #7fbfff; }
        .tier-F { background-color: #ff7fff; }
        .tier-Unranked { background-color: #444; color: #aaa; font-size: 1.2rem; }

        .tier-items {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1rem;
            flex-grow: 1;
            align-items: center;
        }

        .tier-item {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            cursor: default;
            position: relative;
        }
        
        .tier-item:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.1);
        }

        .item-name {
            font-weight: 600;
            font-size: 1rem;
        }
        
        .item-stat {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .tierlist-header {
            padding: 1.5rem;
            background: rgba(0,0,0,0.5);
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
        }
        
        .tierlist-header h2 {
            margin: 0;
            color: white;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }
        
        .tierlist-header p {
            margin-top: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--accent-secondary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

    
        .tier-item-img {
            width: 80px;
            height: auto;
            border-radius: 6px;
            margin-bottom: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb primary"></div>
        <div class="glow-orb secondary"></div>
    </div>

    <nav class="navbar">
        <div class="logo">Galaxy<span>Tracker</span></div>
        <div class="nav-links" style="display: flex; gap: 2rem;">
            <a href="index.html" style="color: var(--text-main); text-decoration: none; font-weight: 600;">Home</a>
            <a href="meta.html" style="color: var(--text-main); text-decoration: none; font-weight: 600;">Meta Insights</a>
            <a href="tierlist.html" style="color: var(--accent-secondary); text-decoration: none; font-weight: 600;">Auto Tier List</a>
        </div>
    </nav>

    <main class="tierlist-dashboard">
        <div class="stats-header">
            <h1>Automated <span>Tier List</span></h1>
            <div class="controls-group">
                <select id="season-filter" class="filter-select"><option value="all">All Seasons</option></select>
                <select id="query-filter" class="filter-select">
                    <option value="captains">Captains</option>
                    <option value="cards">Cards (WIP)</option>
                </select>
                <select id="mmr-filter" class="filter-select">
                    <option value="0-99999">All MMR</option>
                    <option value="0-2500">&lt; 2500 MMR</option>
                    <option value="2500-3000">2500 - 3000 MMR</option>
                    <option value="3000-3500">3000 - 3500 MMR</option>
                    <option value="3500-4000">3500 - 4000 MMR</option>
                    <option value="4000-99999">&gt; 4000 MMR</option>
                </select>
                <button id="export-btn" class="export-btn">📸 Download Image</button>
            </div>
        </div>

        <div id="capture-area" class="tierlist-container">
            <div class="tierlist-header">
                <h2 id="tierlist-title">Captain Tier List (All MMR)</h2>
                <p id="tierlist-subtitle">Based on Average Placement via Galaxy Tracker Analytics</p>
            </div>
            <div id="tierlist-content">
                <div class="loading"><div class="spinner"></div><div>Calculating Standard Deviations...</div></div>
            </div>
        </div>
    </main>

    <script src="tierlist.js?v=23"></script>
</body>
</html>
